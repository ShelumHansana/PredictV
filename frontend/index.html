<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Answer a few simple questions about your petrol motorbike and see the most likely faults and how to fix them." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PredictV — Motorbike fault finder</title>
    <script>
      // set the theme before the first paint so the page never flashes
      try {
        var t = localStorage.getItem("predictv_theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
